[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
lexopt = "0.3.2"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Storage_FileSystem"] }
